about:
  paragraphs:
    - "I am a Postdoctoral Associate in the School of Civil and Environmental Engineering at Cornell University, working with Professor [Linda Nozick](https://www.engineering.cornell.edu/people/linda-k-nozick/). My current work focuses on optimization for stochastic game-theoretic models in natural-hazard insurance and municipal land-use risk management."
    - "Previously, I was a Postdoctoral Researcher in the Artificial Intelligence, Learning, and Intelligent Systems group at the National Renewable Energy Laboratory. I earned my Ph.D. in Industrial and Systems Engineering, with a minor in Mathematics, from North Carolina State University."
